*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 Figtree,system-ui,sans-serif}
header{background:var(--g);color:#fff;padding-block:22px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

const STAGES={"TOF":"Top of funnel · cold","MOF":"Middle of funnel · warm","BOF":"Bottom of funnel · hot"};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const host=u=>{try{return new URL(u).host.toUpperCase()}catch{return''}};
function text(a,id){const t=a.primary||'';if(t.length<=125)return esc(t);return '<span>'+esc(t.slice(0,125).replace(/\s+\S*$/,''))+'…</span> <span class="more" data-more="'+id+'">See more</span><span hidden>'+esc(t)+'</span>'}
function media(a,r){if(a.video)return '<video class="media" src="'+a.video.src+'" poster="'+a.video.poster+'" muted playsinline loop controls preload="none"></video>';
 if(a.videoMissing)return '<div class="miss">Video not generated yet</div>';return '<img class="media" loading="lazy" src="'+a.img[r]+'" alt="'+esc(a.headline)+'">'}
function mock(a,p){
 if(p==='story')return '<div class="story">'+media(a,'9x16').replace('class="media"','class="media"')+'<div class="top"><div class="av"></div><div><b>BetFriend</b><br><small>Sponsored</small></div></div><div class="swipe"><span>'+esc(a.cta)+'</span></div></div>';
 const ig=p==='ig';const head='<div class="mh"><div class="av"></div><div><b>'+(ig?'betfriend':'BetFriend')+'</b><small>Sponsored'+(ig?'':' · 🌐')+'</small></div></div>';
 const bar='<div class="bar"><div style="min-width:0">'+(ig?'':'<div class="u">'+host(a.url)+'</div>')+'<div class="hl">'+esc(a.headline)+'</div>'+(ig?'':'<div class="ds">'+esc(a.desc)+'</div>')+'</div><button>'+esc(a.cta)+'</button></div>';
 if(ig)return '<div class="mock ig">'+head+media(a,'4x5')+bar+'<div class="pt" style="padding-top:10px"><b>betfriend</b> '+text(a,a.id+p)+'</div></div>';
 return '<div class="mock">'+head+'<div class="pt">'+text(a,a.id+p)+'</div>'+media(a,'1x1')+bar+'</div>'}
const PL=[['fb','Facebook Feed'],['ig','Instagram Feed'],['story','Reels / Stories']];
function card(a){const pls=a.video?[['story','Reels / Stories']]:PL;
 return '<article class="ad" data-id="'+a.id+'"><div class="meta"><div><div class="id">'+a.id+'</div><div class="angle">'+esc(a.angle)+'</div></div><span class="tag">'+(a.video?'Video '+(a.video?.dur||'')+'s':'Static')+'</span></div>'
 +'<div class="seg">'+pls.map(([k,l],i)=>'<button data-p="'+k+'" aria-pressed="'+(i===0)+'">'+l+'</button>').join('')+'</div>'
 +'<div class="stagebox">'+mock(a,pls[0][0])+'</div>'
 +'<details><summary>Copy, link and tools</summary><dl class="copy"><dt>Primary text</dt><dd style="white-space:pre-line">'+esc(a.primary)+'</dd><dt>Headline</dt><dd>'+esc(a.headline)+'</dd><dt>Description</dt><dd>'+esc(a.desc)+'</dd><dt>Button</dt><dd>'+esc(a.cta)+'</dd>'
 +(a.hook?'<dt>First-second hook</dt><dd>'+esc(a.hook)+'</dd>':'')+'<dt>Destination</dt><dd><a href="'+esc(a.url)+'" target="_blank" rel="noopener">'+esc(a.url)+'</a></dd><dt>Tools sold</dt><dd class="chips">'+a.tools.map(t=>'<span>'+esc(t)+'</span>').join('')+'</dd></dl></details></article>'}
const order=['ALL','TOF','MOF','BOF'];
document.getElementById('tabs').innerHTML=order.map(s=>'<button data-s="'+s+'" aria-pressed="false">'+(s==='ALL'?'All ads':s)+'</button>').join('');
function show(s){if(!order.includes(s))s='ALL';
 document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===s));
 const st=s==='ALL'?['TOF','MOF','BOF']:[s];
 document.getElementById('main').innerHTML=st.map(k=>'<h2 class="stage-h">'+k+'</h2><p class="stage-p">'+STAGES[k]+'</p><div class="grid">'+ADS.filter(a=>a.stage===k).map(card).join('')+'</div>').join('')}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const s=b.dataset.s;try{history.replaceState(null,'',s==='ALL'?location.pathname:'#'+s.toLowerCase())}catch{}show(s)});
document.getElementById('main').addEventListener('click',e=>{const m=e.target.closest('[data-more]');if(m){m.previousElementSibling.hidden=true;m.nextElementSibling.hidden=false;m.remove();return}
 const b=e.target.closest('.seg button');if(!b)return;const art=b.closest('.ad');const a=ADS.find(x=>x.id===art.dataset.id);
 art.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));art.querySelector('.stagebox').innerHTML=mock(a,b.dataset.p)});
show((location.hash.slice(1)||'all').toUpperCase());
